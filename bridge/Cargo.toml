[package]
name = "jet-interactive"
version = "0.1.0"
edition = "2024"
description = "Browser bridge for jet-interactive.nvim"
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
include_dir = "0.7"
mime_guess = "2"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tokio-tungstenite = "0.29"
